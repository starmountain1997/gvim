apiversion: modelslim_v1

metadata:
  config_id: hy3_w4a8
  score: 90
  verified_model_types:
    - Hy-MT2-30B-A3B
  label:
    w_bit: 4
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w4a8_dynamic: &default_w4a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int4"
    symmetric: True
    method: "ssz"

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "minmax"

spec:
  process:
    # Step 1: Outlier suppression via SmoothQuant (standard for MoE W4A8)
    - type: "flex_smooth_quant"
      enable_subgraph_type:
        - 'norm-linear'
      include:
        - '*'
      exclude:
        - 'lm_head'
        - '*router.gate'

    # Step 2: Mixed quantization group
    - type: "group"
      configs:
        # Attention: W8A8 (preserve accuracy)
        - type: "linear_quant"
          qconfig: *default_w8a8_dynamic
          include:
            - "*self_attn*"

        # Shared MLP + dense MLP (layer 0): W8A8
        - type: "linear_quant"
          qconfig: *default_w8a8_dynamic
          include:
            - "*mlp*"
          exclude:
            - "*gate"
            - "*expert_bias"
            - "*mlp.experts*"

        # Expert layers: W4A8 per_channel + ssz (max memory savings)
        - type: "linear_quant"
          qconfig: *default_w4a8_dynamic
          include:
            - "*mlp.experts*"

  save:
    - type: "ascendv1_saver"
      part_file_size: 4
